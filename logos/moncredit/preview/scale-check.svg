<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" role="img" aria-labelledby="scale-title scale-desc">
  <title id="scale-title">MonCredit logo size and background check</title>
  <desc id="scale-desc">The Open Credit C mark and wordmark at multiple sizes on light and dark backgrounds.</desc>
  <defs>
    <symbol id="open-credit-icon" viewBox="0 0 64 64">
      <path d="M50 10H29C17 10 9 20 9 32S17 54 29 54H50" fill="none" stroke="#7458EE" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="60" cy="32" r="3.8" fill="#55D6B0"/>
    </symbol>
  </defs>
  <rect width="980" height="410" fill="#F8F7FC"/>
  <rect x="28" y="28" width="924" height="220" rx="20" fill="#FFFFFF"/>
  <svg x="58" y="82" width="84" height="84" viewBox="0 0 64 64"><use href="#open-credit-icon"/></svg>
  <text x="166" y="139" fill="#241B3D" font-family="Geist, Inter, Arial, sans-serif" font-size="50" font-weight="650" letter-spacing="-1.8">mon</text>
  <text x="269" y="139" fill="#7458EE" font-family="Geist, Inter, Arial, sans-serif" font-size="50" font-weight="650" letter-spacing="-1.8">credit</text>
  <text x="59" y="208" fill="#77727F" font-family="Geist, Inter, Arial, sans-serif" font-size="12">Full-color horizontal lockup · light surface</text>
  <text x="58" y="296" fill="#241B3D" font-family="Geist, Inter, Arial, sans-serif" font-size="12" font-weight="650">SIZE CHECK</text>
  <text x="58" y="331" fill="#77727F" font-family="Geist, Inter, Arial, sans-serif" font-size="10">16 px</text>
  <svg x="58" y="342" width="16" height="16" viewBox="0 0 64 64"><use href="#open-credit-icon"/></svg>
  <text x="108" y="331" fill="#77727F" font-family="Geist, Inter, Arial, sans-serif" font-size="10">24 px</text>
  <svg x="108" y="342" width="24" height="24" viewBox="0 0 64 64"><use href="#open-credit-icon"/></svg>
  <text x="168" y="331" fill="#77727F" font-family="Geist, Inter, Arial, sans-serif" font-size="10">64 px</text>
  <svg x="168" y="342" width="64" height="64" viewBox="0 0 64 64"><use href="#open-credit-icon"/></svg>
  <rect x="520" y="277" width="432" height="110" rx="18" fill="#241B3D"/>
  <path d="M602 304H577C563 304 554 313 554 327S563 350 577 350H602" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="614" cy="327" r="3.8" fill="#FFFFFF"/>
  <text x="640" y="337" fill="#FFFFFF" font-family="Geist, Inter, Arial, sans-serif" font-size="34" font-weight="650" letter-spacing="-1.1">moncredit</text>
  <text x="553" y="370" fill="#CFC9DD" font-family="Geist, Inter, Arial, sans-serif" font-size="10">One-color reversed lockup · dark surface</text>
</svg>
