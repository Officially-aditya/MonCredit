<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="board-title board-desc">
  <title id="board-title">MonCredit logo concepts</title>
  <desc id="board-desc">A comparison of Bridge M, Open Ledger, and Mutual Span. Bridge M is the recommended direction.</desc>
  <rect width="1120" height="500" fill="#F8F7FC"/>
  <text x="64" y="68" fill="#241B3D" font-family="Geist, Inter, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-1">MonCredit / Logo direction</text>
  <text x="64" y="98" fill="#77727F" font-family="Geist, Inter, Arial, sans-serif" font-size="14">Transparent credit, shared risk, a clear way forward.</text>

  <g id="concept-bridge" transform="translate(64 132)">
    <rect width="310" height="260" rx="18" fill="#FFFFFF" stroke="#B9ADF8" stroke-width="2"/>
    <rect x="24" y="22" width="82" height="82" rx="23" fill="#7458EE"/>
    <path d="M43 83V43L65 64L87 43V83" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M59 64H71" fill="none" stroke="#55D6B0" stroke-width="7" stroke-linecap="round"/>
    <text x="24" y="142" fill="#7458EE" font-family="Geist, Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">RECOMMENDED</text>
    <text x="24" y="174" fill="#241B3D" font-family="Geist, Inter, Arial, sans-serif" font-size="22" font-weight="650" letter-spacing="-.5">Bridge M</text>
    <text x="24" y="202" fill="#77727F" font-family="Geist, Inter, Arial, sans-serif" font-size="12">A custom M joins borrower and lender</text>
    <text x="24" y="221" fill="#77727F" font-family="Geist, Inter, Arial, sans-serif" font-size="12">through one shared span.</text>
  </g>

  <g id="concept-ledger" transform="translate(405 132)">
    <rect width="310" height="260" rx="18" fill="#FFFFFF" stroke="#E7E4ED"/>
    <rect x="24" y="22" width="82" height="82" rx="23" fill="#F1EEFF"/>
    <path d="M43 40C53 39 61 43 65 49C69 43 77 39 87 40V82C77 81 69 85 65 91C61 85 53 81 43 82V40Z" fill="none" stroke="#7458EE" stroke-width="5" stroke-linejoin="round"/>
    <path d="M65 50V86" stroke="#55D6B0" stroke-width="5" stroke-linecap="round"/>
    <text x="24" y="174" fill="#241B3D" font-family="Geist, Inter, Arial, sans-serif" font-size="22" font-weight="650" letter-spacing="-.5">Open Ledger</text>
    <text x="24" y="202" fill="#77727F" font-family="Geist, Inter, Arial, sans-serif" font-size="12">Two open pages meet at a shared</text>
    <text x="24" y="221" fill="#77727F" font-family="Geist, Inter, Arial, sans-serif" font-size="12">record of terms and repayment.</text>
  </g>

  <g id="concept-span" transform="translate(746 132)">
    <rect width="310" height="260" rx="18" fill="#FFFFFF" stroke="#E7E4ED"/>
    <rect x="24" y="22" width="82" height="82" rx="23" fill="#F1EEFF"/>
    <path d="M44 84V48C44 43 48 39 53 39H54C59 39 63 43 63 48V84M67 84V48C67 43 71 39 76 39H77C82 39 86 43 86 48V84" fill="none" stroke="#7458EE" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M58 64H72" stroke="#55D6B0" stroke-width="6" stroke-linecap="round"/>
    <text x="24" y="174" fill="#241B3D" font-family="Geist, Inter, Arial, sans-serif" font-size="22" font-weight="650" letter-spacing="-.5">Mutual Span</text>
    <text x="24" y="202" fill="#77727F" font-family="Geist, Inter, Arial, sans-serif" font-size="12">Paired supports share the load</text>
    <text x="24" y="221" fill="#77727F" font-family="Geist, Inter, Arial, sans-serif" font-size="12">through a single connector.</text>
  </g>

  <text x="64" y="443" fill="#77727F" font-family="Geist, Inter, Arial, sans-serif" font-size="12">Violet #7458EE</text>
  <rect x="157" y="429" width="18" height="18" rx="5" fill="#7458EE"/>
  <text x="193" y="443" fill="#77727F" font-family="Geist, Inter, Arial, sans-serif" font-size="12">Mint #55D6B0</text>
  <rect x="281" y="429" width="18" height="18" rx="5" fill="#55D6B0"/>
  <text x="330" y="443" fill="#77727F" font-family="Geist, Inter, Arial, sans-serif" font-size="12">Ink #241B3D</text>
  <rect x="412" y="429" width="18" height="18" rx="5" fill="#241B3D"/>
  <text x="1056" y="443" fill="#77727F" text-anchor="end" font-family="Geist, Inter, Arial, sans-serif" font-size="12">Concept 01 selected</text>
</svg>
